<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1628"/>
      <stop offset=".5" stop-color="#0E1F39"/>
      <stop offset="1" stop-color="#0B2A38"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4DD6DB"/>
      <stop offset=".55" stop-color="#4A7BEC"/>
      <stop offset="1" stop-color="#7BE495"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DD6DB"/>
      <stop offset="1" stop-color="#4A7BEC"/>
    </linearGradient>
    <radialGradient id="orb1" cx=".18" cy=".22" r=".55">
      <stop offset="0" stop-color="#4DD6DB" stop-opacity=".24"/>
      <stop offset="1" stop-color="#4DD6DB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx=".82" cy=".18" r=".5">
      <stop offset="0" stop-color="#4A7BEC" stop-opacity=".20"/>
      <stop offset="1" stop-color="#4A7BEC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx=".5" cy="1" r=".7">
      <stop offset="0" stop-color="#7BE495" stop-opacity=".12"/>
      <stop offset="1" stop-color="#7BE495" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <rect width="1200" height="600" fill="url(#orb1)"/>
  <rect width="1200" height="600" fill="url(#orb2)"/>
  <rect width="1200" height="600" fill="url(#orb3)"/>

  <!-- PREVIEW pill -->
  <g transform="translate(80 96)">
    <rect width="180" height="48" rx="24" fill="rgba(77,214,219,0.12)" stroke="rgba(77,214,219,0.50)"/>
    <circle cx="28" cy="24" r="6" fill="#4DD6DB">
      <animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="48" y="30" font-family="DM Mono, monospace" font-size="14" font-weight="700" fill="#4DD6DB" letter-spacing="2">PREVIEW · LIVE</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80 200)">
    <text x="0" y="0" font-family="DM Mono, monospace" font-size="14" font-weight="600" fill="#4DD6DB" letter-spacing="3">// PRODUCT UPDATE</text>
    <text x="0" y="84" font-family="Inter, sans-serif" font-size="82" font-weight="900" fill="#F5F7FB" letter-spacing="-3">Introducing</text>
    <text x="0" y="172" font-family="Inter, sans-serif" font-size="82" font-weight="900" fill="url(#brand)" letter-spacing="-3">Oneliq AI.</text>
    <text x="0" y="234" font-family="Inter, sans-serif" font-size="22" font-weight="400" fill="#8CA0BD">Chat about your portfolio, swap in the message,</text>
    <text x="0" y="266" font-family="Inter, sans-serif" font-size="22" font-weight="400" fill="#8CA0BD">set up automation — you always sign. Preview.</text>
  </g>

  <!-- Right: chat + spark motif -->
  <g transform="translate(960 290)">
    <circle r="180" fill="none" stroke="#4DD6DB" stroke-width="1" opacity=".18"/>
    <circle r="140" fill="none" stroke="#4A7BEC" stroke-width="1" opacity=".28"/>
    <!-- Center disk -->
    <circle r="96" fill="rgba(10,22,40,0.9)" stroke="url(#ring)" stroke-width="2.5"/>
    <!-- Spark glyph (✦) -->
    <path d="M 0 -46 C 6 -16 16 -6 46 0 C 16 6 6 16 0 46 C -6 16 -16 6 -46 0 C -16 -6 -6 -16 0 -46 Z" fill="url(#brand)" opacity=".95"/>
    <!-- Chat bubbles orbiting -->
    <g>
      <g transform="translate(150 -30)">
        <rect x="-34" y="-20" width="68" height="40" rx="12" fill="#4DD6DB" opacity=".9"/>
        <circle cx="-14" cy="0" r="4" fill="#0A1628"/><circle cx="0" cy="0" r="4" fill="#0A1628"/><circle cx="14" cy="0" r="4" fill="#0A1628"/>
      </g>
      <g transform="translate(-158 40)">
        <rect x="-30" y="-18" width="60" height="36" rx="11" fill="#4A7BEC" opacity=".85"/>
        <rect x="-16" y="-5" width="32" height="4" rx="2" fill="#0A1628"/>
        <rect x="-16" y="4" width="20" height="4" rx="2" fill="#0A1628"/>
      </g>
    </g>
    <circle r="140" fill="none" stroke="#4DD6DB" stroke-width="1" opacity=".4">
      <animate attributeName="r" values="140;170;140" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".4;0;.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Brand bottom -->
  <g transform="translate(80 540)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="20" font-weight="900" fill="#F5F7FB" letter-spacing="-.5">Oneliq</text>
    <text x="100" y="0" font-family="DM Mono, monospace" font-size="13" fill="#8CA0BD" letter-spacing="2">// oneliq.xyz/agent  ·  Aug 9, 2026</text>
  </g>
</svg>

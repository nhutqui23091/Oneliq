<style>
/* ============================================================
   DASHBOARD (user) - profile + portfolio home.
   All tokens are prefixed .db-* so they never collide with the
   shared primitives in arc-ui.css or the operator console (/ops).
   Visual language inherited from /trade, /balance, /history.
============================================================ */

.db-wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:48px 36px 80px}

/* PROFILE HERO */
.db-hero{position:relative;padding:32px 34px;border-radius:24px;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(20px);overflow:hidden;margin-bottom:22px}
.db-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 10%,rgba(77,214,219,.45) 50%,transparent 90%)}
.db-hero::after{content:'';position:absolute;right:-160px;top:-160px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(77,214,219,.10) 0%,transparent 60%);pointer-events:none}
.db-hero-eyebrow{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--arc1);margin-bottom:22px;display:inline-block}
.db-id{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.db-avatar{width:88px;height:88px;border-radius:22px;flex-shrink:0;overflow:hidden;border:1px solid var(--border);background:var(--surface2)}
.db-avatar svg{display:block;width:100%;height:100%}
.db-id-main{min-width:0}
.db-conn{display:inline-flex;align-items:center;gap:9px;margin-bottom:10px}
.db-conn-dot{width:8px;height:8px;border-radius:50%;background:var(--arc4);box-shadow:0 0 8px var(--arc4)}
.db-conn-txt{font-size:14.5px;font-weight:600;color:var(--text)}
.db-addr{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);font-family:var(--mono);font-size:13.5px;color:var(--muted);cursor:pointer;transition:all .15s;vertical-align:middle}
.db-addr:hover{color:var(--text);border-color:var(--border2)}
.db-addr .cp{font-size:12px;opacity:.7}
.db-total{font-family:var(--display);font-size:clamp(42px,5.6vw,66px);font-weight:300;letter-spacing:-.03em;line-height:1;color:var(--text);margin:8px 0 10px;font-variant-numeric:tabular-nums}
.db-change{font-size:15px;font-family:var(--mono);font-weight:600;color:var(--muted)}
.db-change.up{color:var(--arc4)}
.db-change.down{color:var(--c-pink)}
.db-change .muted{color:var(--muted);font-weight:500}

/* SECTIONS — full-width, stacked, collapsible (click the header to toggle) */
.db-card{position:relative;padding:0 30px;border-radius:20px;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(20px);overflow:hidden;margin-bottom:18px}
.db-card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:24px 0 20px;cursor:pointer;user-select:none}
.db-card-title{font-size:20px;font-weight:600;color:var(--text);letter-spacing:-.015em;display:flex;align-items:center;gap:12px}
.db-card-title .n{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--muted);padding:3px 11px;border-radius:20px;background:var(--surface2);border:1px solid var(--border)}
.db-head-r{display:flex;align-items:center;gap:16px}
.db-card-link{font-size:13.5px;font-weight:600;color:var(--arc1);text-decoration:none;transition:opacity .15s}
.db-card-link:hover{opacity:.75}
/* Tabs inside a card head (Holdings ⇄ Allocation) */
.db-tabs{display:flex;align-items:center;gap:22px}
.db-tab{position:relative;font-family:var(--font);font-size:20px;font-weight:600;letter-spacing:-.015em;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 0;display:inline-flex;align-items:center;gap:11px;transition:color .15s}
.db-tab:hover{color:var(--text)}
.db-tab.active{color:var(--text)}
.db-tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:2px;background:linear-gradient(90deg,var(--arc1),var(--arc2));border-radius:2px}
.db-tab .n{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--muted);padding:3px 11px;border-radius:20px;background:var(--surface2);border:1px solid var(--border)}
.db-pane[hidden]{display:none}
.db-chev{width:28px;height:28px;border-radius:9px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;transition:transform .2s,color .15s,border-color .15s;flex-shrink:0}
.db-card-head:hover .db-chev{color:var(--text);border-color:var(--border2)}
.db-card.collapsed .db-chev{transform:rotate(-90deg)}
.db-card-body{padding:0 0 26px}
.db-card.collapsed .db-card-body{display:none}

/* HOLDINGS TABLE */
.db-tbl{width:100%;border-collapse:collapse}
.db-tbl th{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 0 14px}
.db-tbl th:first-child{text-align:left}
.db-tbl td{padding:18px 0;border-top:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
.db-tbl td:first-child{text-align:left}
.db-tok{display:flex;align-items:center;gap:14px}
.db-tok img{width:40px;height:40px;border-radius:50%;background:var(--surface2);flex-shrink:0}
.db-tok-sym{font-size:17px;font-weight:700;color:var(--text)}
.db-tok-name{font-size:12.5px;color:var(--muted);margin-top:2px}
.db-bal{font-family:var(--mono);font-size:16px;color:var(--text)}
.db-price{font-family:var(--mono);font-size:15px;color:var(--muted)}
.db-val{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--text)}

/* ALLOCATION DONUT */
.db-donut-wrap{display:flex;align-items:center;gap:40px;flex-wrap:wrap;justify-content:center}
.db-donut{position:relative;width:190px;height:190px;flex-shrink:0}
.db-donut svg{transform:rotate(-90deg)}
.db-donut-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.db-donut-mid .l{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.db-donut-mid .v{font-family:var(--display);font-size:25px;font-weight:500;color:var(--text);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.db-legend{display:flex;flex-direction:column;gap:16px;min-width:200px;flex:1}
.db-leg-row{display:flex;align-items:center;gap:12px;font-size:15.5px}
.db-leg-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.db-leg-sym{font-weight:600;color:var(--text)}
.db-leg-pct{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--text);font-size:15.5px}
.db-leg-val{font-family:var(--mono);font-size:13px;color:var(--muted);width:100%;text-align:right;margin-top:-8px}

/* CROSS-CHAIN LIST */
.db-cc-top{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.db-cc-total{font-family:var(--display);font-size:32px;font-weight:400;color:var(--text);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.db-cc-total .u{font-size:14px;color:var(--muted);font-weight:600;margin-left:5px}
.db-cc-sub{font-size:13px;color:var(--muted);font-family:var(--mono)}
.db-cc-row{display:flex;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--border)}
.db-cc-row img{width:32px;height:32px;border-radius:50%;flex-shrink:0}
.db-cc-name{font-size:15.5px;font-weight:600;color:var(--text)}
.db-cc-pend{font-size:12px;color:var(--yellow);font-family:var(--mono);margin-top:2px}
.db-cc-amt{margin-left:auto;font-family:var(--mono);font-size:16px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

/* ACTIVITY */
.db-act-row{display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--border);cursor:pointer}
.db-act-row:first-child{border-top:none}
.db-act-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.db-act-ico.k-trade{background:rgba(77,214,219,.10);color:var(--arc1)}
.db-act-ico.k-balance{background:linear-gradient(135deg,rgba(74,123,236,.16),rgba(77,214,219,.08));color:var(--arc2)}
.db-act-ico.k-fail{background:rgba(255,107,138,.10);color:var(--c-pink)}
.db-act-main{min-width:0}
.db-act-t{font-size:15.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db-act-s{font-size:12.5px;color:var(--muted);font-family:var(--mono);margin-top:3px}
.db-act-amt{font-family:var(--mono);font-size:15.5px;font-weight:700;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.db-act-amt small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}

/* EMPTY / SKELETON */
.db-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:46px 20px;text-align:center}
.db-empty-ico{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,rgba(77,214,219,.10),rgba(74,123,236,.06));border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--arc1);margin-bottom:16px}
.db-empty-t{font-size:15.5px;font-weight:600;color:var(--text);margin-bottom:6px}
.db-empty-s{font-size:13.5px;color:var(--muted);max-width:340px;line-height:1.6;margin-bottom:18px}
.db-cta{display:inline-flex;align-items:center;gap:6px;padding:12px 22px;border-radius:12px;background:rgba(77,214,219,.12);border:1px solid rgba(77,214,219,.32);color:var(--arc1);font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;transition:all .15s}
.db-cta:hover{background:rgba(77,214,219,.18);border-color:rgba(77,214,219,.5)}
.db-skel{background:linear-gradient(90deg,var(--surface) 0%,var(--surface2) 50%,var(--surface) 100%);background-size:200% 100%;animation:db-shimmer 1.3s infinite;border-radius:6px;display:inline-block}
@keyframes db-shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.db-muted{color:var(--muted-soft)}

@media(max-width:900px){.db-wrap{padding:72px 18px 60px}}
@media(max-width:680px){
  .db-wrap{padding:68px 14px 50px}
  .db-hero{padding:24px 20px}
  .db-card{padding:0 18px}
  .db-card-title{font-size:18px}
  .db-donut-wrap{gap:22px}
}
</style>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"
        integrity="sha384-6Zl0Pc8zjSz8KvmNeXRvUQgY4ryFb+BwDvKCmLYcBME0joAaru491tQgi9B7zsMM"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>

<script>
(async () => {
  /* ============================================================
     User Dashboard — the portfolio home for a connected wallet.

     Five modules, all wallet-reactive:
       1. Profile hero  — deterministic avatar, address, total USD, 24h Δ
       2. Holdings      — Arc token balances (USDC/EURC/cirBTC) × price
       3. Allocation    — donut of holdings by USD weight
       4. Cross-chain   — unified USDC across Gateway chains (arc-gateway)
       5. Activity      — latest receipts (same feed as /history)

     Prices come from CoinGecko (BTC → cirBTC, EUR → EURC; USDC pinned $1),
     cached in localStorage so a failed/rate-limited fetch degrades to the
     last good numbers instead of blanking the portfolio.
  ============================================================ */

  await ArcUI.bootApp('dashboard');

  // ── ACCORDION ─────────────────────────────────────────────────
  // Every section header toggles its own body. Collapsed sections are
  // remembered per-browser so the layout stays how the user left it.
  const COLLAPSE_KEY = 'arc.dash.collapsed.v1';
  function loadCollapsed(){ try { return new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '[]')); } catch { return new Set(); } }
  function saveCollapsed(set){ try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...set])); } catch {} }
  (function setupAccordion(){
    const collapsed = loadCollapsed();
    document.querySelectorAll('.db-card[data-card]').forEach(card => {
      const id = card.getAttribute('data-card');
      if (collapsed.has(id)) card.classList.add('collapsed');
      const head = card.querySelector('.db-card-head');
      head.setAttribute('role', 'button');
      head.setAttribute('tabindex', '0');
      const toggle = () => {
        const now = card.classList.toggle('collapsed');
        const set = loadCollapsed();
        if (now) set.add(id); else set.delete(id);
        saveCollapsed(set);
      };
      head.addEventListener('click', e => {
        // Let deep-links (Trade →) and tab buttons handle their own clicks;
        // only bare header area / the chevron toggles collapse.
        if (e.target.closest('a, button')) return;
        toggle();
      });
      head.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });
  })();

  // ── TABS (Holdings ⇄ Allocation, sharing one card) ────────────
  (function setupTabs(){
    document.querySelectorAll('.db-tabs').forEach(tabs => {
      const card = tabs.closest('.db-card');
      tabs.querySelectorAll('.db-tab').forEach(tab => {
        tab.addEventListener('click', e => {
          e.stopPropagation();
          const which = tab.getAttribute('data-tab');
          tabs.querySelectorAll('.db-tab').forEach(t => {
            const on = t === tab;
            t.classList.toggle('active', on);
            t.setAttribute('aria-selected', on ? 'true' : 'false');
          });
          card.querySelectorAll('.db-pane').forEach(p => {
            p.hidden = p.getAttribute('data-pane') !== which;
          });
        });
      });
    });
  })();

  const ARC_TOKENS = ARC.TOKENS.arc;           // { USDC, EURC, cirBTC }
  const ORDER = ['USDC', 'EURC', 'cirBTC'];
  const TOK_COLOR = { USDC: '#4DD6DB', EURC: '#4A7BEC', cirBTC: '#F4A93A' };
  // CoinGecko id per symbol (USDC pinned to $1, no lookup needed).
  const CG_ID = { EURC: 'euro-coin', cirBTC: 'bitcoin' };
  const PRICE_KEY = 'arc.dash.prices.v1';

  // addr starts `undefined` (not null) so the first wallet event — even a
  // disconnected one (addr → null) — always differs and paints a state.
  const state = { addr: undefined, prices: null, holdings: [], total: 0 };

  // ── UTILS ─────────────────────────────────────────────────────
  function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function fmtUsd(n, frac = 2){
    if (n == null || !isFinite(n)) return '$0.00';
    return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: frac, maximumFractionDigits: frac });
  }
  function fmtRelTime(ts){
    if (!ts) return '';
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return `${s}s ago`;
    const m = Math.floor(s/60); if (m < 60) return `${m}m ago`;
    const h = Math.floor(m/60); if (h < 24) return `${h}h ago`;
    const d = Math.floor(h/24); if (d < 7) return `${d}d ago`;
    return new Date(ts).toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }
  function balToFloat(raw, decimals){ return Number(ARC.formatAmt(raw, decimals, decimals)) || 0; }

  // ── AVATAR (deterministic from address) ───────────────────────
  // Two hues derived from address bytes → a soft gradient orb. Stable per
  // wallet, no external identicon dependency (keeps CSP tight).
  function avatarSvg(addr){
    const a = (addr || '0x0').toLowerCase();
    let h1 = 0, h2 = 0;
    for (let i = 2; i < a.length; i++){ const c = a.charCodeAt(i); h1 = (h1 * 31 + c) % 360; h2 = (h2 * 17 + c) % 360; }
    const c1 = `hsl(${h1},70%,58%)`, c2 = `hsl(${(h2+120)%360},72%,52%)`, c3 = `hsl(${(h1+40)%360},65%,45%)`;
    const gid = 'g' + (h1 * 1000 + h2);
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs><radialGradient id="${gid}" cx="30%" cy="28%" r="90%">
        <stop offset="0%" stop-color="${c1}"/><stop offset="55%" stop-color="${c2}"/><stop offset="100%" stop-color="${c3}"/>
      </radialGradient></defs>
      <rect width="100" height="100" fill="url(#${gid})"/>
      <circle cx="70" cy="72" r="26" fill="rgba(var(--tint),.14)"/>
      <circle cx="34" cy="40" r="15" fill="rgba(var(--tint),.10)"/>
    </svg>`;
  }

  // ── PRICES ────────────────────────────────────────────────────
  function cachedPrices(){
    try { return JSON.parse(localStorage.getItem(PRICE_KEY) || 'null'); } catch { return null; }
  }
  async function fetchPrices(){
    const base = { USDC: { usd: 1, change: 0 }, EURC: { usd: null, change: 0 }, cirBTC: { usd: null, change: 0 } };
    try {
      const ids = [...new Set(Object.values(CG_ID))].join(',');
      const url = `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`;
      const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      for (const sym of Object.keys(CG_ID)){
        const row = j[CG_ID[sym]];
        if (row && typeof row.usd === 'number'){
          base[sym] = { usd: row.usd, change: typeof row.usd_24h_change === 'number' ? row.usd_24h_change : 0 };
        }
      }
      const complete = Object.values(base).every(p => typeof p.usd === 'number');
      if (complete){ try { localStorage.setItem(PRICE_KEY, JSON.stringify(base)); } catch {} return base; }
      throw new Error('incomplete');
    } catch (e) {
      console.warn('[dashboard] price fetch failed, using cache:', e?.message || e);
      const cached = cachedPrices();
      if (cached) return cached;
      // Last resort: pin what we can, leave the rest null (rendered as "—").
      return base;
    }
  }

  // ── HOLDINGS ──────────────────────────────────────────────────
  async function loadHoldings(){
    const addr = state.addr;
    const rows = await Promise.all(ORDER.map(async sym => {
      const tok = ARC_TOKENS[sym];
      let raw = 0n;
      try { raw = await ARC.tokenBalance('arc', tok, addr); } catch {}
      const bal = balToFloat(raw, tok.decimals);
      const p = state.prices?.[sym] || { usd: null, change: 0 };
      const value = (p.usd != null) ? bal * p.usd : null;
      return { sym, tok, bal, price: p.usd, change: p.change, value };
    }));
    state.holdings = rows;
    state.total = rows.reduce((a, r) => a + (r.value || 0), 0);
  }

  function renderHoldings(){
    const el = document.getElementById('db-holdings');
    const nEl = document.getElementById('db-hold-n');
    const held = state.holdings.filter(r => r.bal > 0);
    nEl.textContent = `${held.length} asset${held.length === 1 ? '' : 's'}`;
    const rows = state.holdings.map(r => `
      <tr>
        <td>
          <div class="db-tok">
            <img src="${escapeHtml(r.tok.icon)}" alt="" onerror="this.style.visibility='hidden'"/>
            <div><div class="db-tok-sym">${escapeHtml(r.sym)}</div><div class="db-tok-name">${escapeHtml(r.tok.name)}</div></div>
          </div>
        </td>
        <td><span class="db-bal">${r.bal.toLocaleString('en-US',{maximumFractionDigits:6})}</span></td>
        <td><span class="db-price">${r.price != null ? fmtUsd(r.price, r.price >= 1000 ? 2 : (r.price >= 1 ? 2 : 4)) : '—'}</span></td>
        <td><span class="db-val">${r.value != null ? fmtUsd(r.value) : '—'}</span></td>
      </tr>`).join('');
    el.innerHTML = `
      <table class="db-tbl">
        <thead><tr><th>Token</th><th>Balance</th><th>Price</th><th>Value</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  // ── ALLOCATION DONUT ──────────────────────────────────────────
  function renderAllocation(){
    const el = document.getElementById('db-alloc');
    const parts = state.holdings.filter(r => (r.value || 0) > 0);
    const total = parts.reduce((a, r) => a + r.value, 0);
    if (!total){
      el.innerHTML = `<div class="db-empty"><div class="db-empty-ico">◔</div><div class="db-empty-t">No holdings yet</div><div class="db-empty-s">Your asset mix will appear here once you hold USDC, EURC, or cirBTC.</div></div>`;
      return;
    }
    const SZ = 190, MID = SZ / 2, R = 76, C = 2 * Math.PI * R, W = 22;
    let off = 0;
    const segs = parts.map(r => {
      const frac = r.value / total;
      const len = frac * C;
      const seg = `<circle cx="${MID}" cy="${MID}" r="${R}" fill="none" stroke="${TOK_COLOR[r.sym]}" stroke-width="${W}" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
      off += len;
      return seg;
    }).join('');
    const legend = parts.map(r => {
      const pct = (r.value / total) * 100;
      return `<div>
        <div class="db-leg-row">
          <span class="db-leg-dot" style="background:${TOK_COLOR[r.sym]}"></span>
          <span class="db-leg-sym">${escapeHtml(r.sym)}</span>
          <span class="db-leg-pct">${pct.toFixed(1)}%</span>
        </div>
        <div class="db-leg-val">${fmtUsd(r.value)}</div>
      </div>`;
    }).join('');
    el.innerHTML = `
      <div class="db-donut-wrap">
        <div class="db-donut">
          <svg width="${SZ}" height="${SZ}" viewBox="0 0 ${SZ} ${SZ}">
            <circle cx="${MID}" cy="${MID}" r="${R}" fill="none" stroke="var(--border)" stroke-width="${W}"/>
            ${segs}
          </svg>
          <div class="db-donut-mid"><span class="l">Total</span><span class="v">${fmtUsd(total, total >= 1000 ? 0 : 2)}</span></div>
        </div>
        <div class="db-legend">${legend}</div>
      </div>`;
  }

  // ── CROSS-CHAIN USDC (Gateway unified balance) ────────────────
  async function renderCrossChain(){
    const el = document.getElementById('db-crosschain');
    el.innerHTML = `<div class="db-cc-top"><span class="db-cc-total db-skel" style="width:120px;height:24px"></span></div>`;
    let balances = [];
    try {
      const res = await ARC.gateway.readBalances(state.addr);
      balances = (res.balances || []).filter(b => b.chainKey);
    } catch (e) {
      console.warn('[dashboard] cross-chain read failed:', e?.message || e);
      el.innerHTML = `<div class="db-empty"><div class="db-empty-ico">⊘</div><div class="db-empty-t">Couldn't load balances</div><div class="db-empty-s">The Gateway balance service is unreachable right now. Try again shortly.</div></div>`;
      return;
    }
    const withBal = balances.filter(b => (b.canonical || 0n) > 0n || (b.pending || 0n) > 0n);
    const totalRaw = balances.reduce((a, b) => a + (b.canonical || 0n), 0n);
    const totalDisplay = ARC.formatAmt(totalRaw, 6, 2);
    if (!withBal.length){
      el.innerHTML = `
        <div class="db-cc-top"><span class="db-cc-total">0.00<span class="u">USDC</span></span></div>
        <div class="db-empty"><div class="db-empty-ico">◈</div><div class="db-empty-t">No cross-chain balance</div><div class="db-empty-s">Deposit USDC into your Unified Balance to spend it on any chain.</div><a class="db-cta" href="/balance">Open Balance →</a></div>`;
      return;
    }
    const rows = withBal
      .sort((a, b) => (b.canonical > a.canonical ? 1 : -1))
      .map(b => {
        const c = ARC.CHAINS[b.chainKey];
        const name = c?.name || c?.short || b.chainKey;
        const pend = (b.pending || 0n) > 0n ? `<div class="db-cc-pend">+${b.pendingDisplay} pending</div>` : '';
        return `<div class="db-cc-row">
          <img src="${escapeHtml(ARC.chainIcon(b.chainKey))}" alt="" onerror="this.style.visibility='hidden'"/>
          <div><div class="db-cc-name">${escapeHtml(name)}</div>${pend}</div>
          <div class="db-cc-amt">${b.display}</div>
        </div>`;
      }).join('');
    el.innerHTML = `
      <div class="db-cc-top">
        <span class="db-cc-total">${totalDisplay}<span class="u">USDC</span></span>
        <span class="db-cc-sub">across ${withBal.length} chain${withBal.length === 1 ? '' : 's'}</span>
      </div>
      ${rows}`;
  }

  // ── RECENT ACTIVITY ───────────────────────────────────────────
  function loadLocalActivity(){
    try { return JSON.parse(localStorage.getItem('arc.trade.activity.v1') || '[]'); } catch { return []; }
  }
  async function renderActivity(){
    const el = document.getElementById('db-activity');
    let rows = loadLocalActivity();
    try {
      if (window.ARC?.history){
        const server = await ARC.history.list(state.addr);
        rows = [...rows, ...(server || [])];
      }
    } catch {}
    // Dedupe by hash+at, newest first, keep 6.
    const seen = new Set(), merged = [];
    for (const x of rows){
      const key = `${x.hash || ''}-${x.at || ''}`;
      if (seen.has(key)) continue; seen.add(key); merged.push(x);
    }
    merged.sort((a, b) => (b.at || 0) - (a.at || 0));
    const top = merged.slice(0, 6);

    if (!top.length){
      el.innerHTML = `<div class="db-empty"><div class="db-empty-ico">◇</div><div class="db-empty-t">No activity yet</div><div class="db-empty-s">Your trades and balance settlements will show up here.</div><a class="db-cta" href="/trade">Make a trade →</a></div>`;
      return;
    }
    el.innerHTML = top.map(x => {
      const isFail = x.status && x.status !== 'done' && x.status !== 'completed' && (x.status === 'failed' || x.status === 'error');
      const isBal = x.kind === 'bridge';
      const cls = isFail ? 'k-fail' : (isBal ? 'k-balance' : 'k-trade');
      const glyph = isFail ? '!' : (isBal ? '⊳' : '⇄');
      const c = ARC.CHAINS[x.chain];
      const href = (x.hash && c?.explorerTx) ? c.explorerTx(x.hash) : '';
      const amtM = /(\d+(?:\.\d+)?)\s*USDC/i.exec(x.text || '');
      const amt = amtM ? `<div class="db-act-amt">${Number(amtM[1]).toLocaleString('en-US',{maximumFractionDigits:2})}<small>USDC</small></div>` : `<div class="db-act-amt db-muted">—</div>`;
      return `<div class="db-act-row" data-href="${escapeHtml(href)}">
        <div class="db-act-ico ${cls}">${glyph}</div>
        <div class="db-act-main">
          <div class="db-act-t">${escapeHtml(x.text || 'Transaction')}</div>
          <div class="db-act-s">${fmtRelTime(x.at)}</div>
        </div>
        ${amt}
      </div>`;
    }).join('');
    el.querySelectorAll('.db-act-row').forEach(row => {
      row.addEventListener('click', () => {
        const h = row.getAttribute('data-href');
        if (h) window.open(h, '_blank', 'noopener');
      });
    });
  }

  // ── PROFILE HERO ──────────────────────────────────────────────
  function renderProfile(){
    document.getElementById('db-avatar').innerHTML = avatarSvg(state.addr);
    // Rebuild the whole connection row so it's robust even after a prior
    // disconnected paint replaced its inner nodes.
    const conn = document.getElementById('db-conn');
    conn.innerHTML = `<span class="db-conn-dot"></span><span class="db-conn-txt">Connected</span><span class="db-addr" id="db-addr" title="Copy address">${ARC.shortAddr(state.addr)} <span class="cp">⧉</span></span>`;
    const addrEl = document.getElementById('db-addr');
    addrEl.onclick = () => {
      navigator.clipboard?.writeText(state.addr).then(() => {
        ArcUI.toast?.('success', 'Copied', 'Address copied to clipboard.');
      }).catch(() => {});
    };
    document.getElementById('db-total').textContent = fmtUsd(state.total);

    // 24h change = value-weighted average of each holding's 24h % move.
    const chEl = document.getElementById('db-change');
    const priced = state.holdings.filter(r => r.value != null && r.value > 0);
    const tot = priced.reduce((a, r) => a + r.value, 0);
    if (!tot){ chEl.className = 'db-change'; chEl.innerHTML = `<span class="muted">No priced holdings</span>`; return; }
    const wPct = priced.reduce((a, r) => a + r.value * (r.change || 0), 0) / tot;
    const usdDelta = tot * (wPct / 100);
    const dir = wPct > 0.005 ? 'up' : (wPct < -0.005 ? 'down' : '');
    const sign = wPct >= 0 ? '+' : '';
    chEl.className = 'db-change ' + dir;
    chEl.innerHTML = `${sign}${wPct.toFixed(2)}% <span class="muted">(${sign}${fmtUsd(Math.abs(usdDelta))}) · 24h</span>`;
  }

  // ── EMPTY (disconnected) ──────────────────────────────────────
  function renderDisconnected(){
    document.getElementById('db-avatar').innerHTML = avatarSvg('0x0');
    document.getElementById('db-conn').innerHTML = `<span class="db-conn-txt">Not connected</span>`;
    document.getElementById('db-total').textContent = '$0.00';
    const chEl = document.getElementById('db-change');
    chEl.className = 'db-change';
    chEl.innerHTML = `<span class="muted">Connect your wallet to see your portfolio</span>`;
    const connectCard = `<div class="db-empty"><div class="db-empty-ico">◇</div><div class="db-empty-t">Connect your wallet</div><div class="db-empty-s">Your holdings, allocation, cross-chain balance, and activity all live here.</div><button class="db-cta" id="db-connect">Connect Wallet</button></div>`;
    document.getElementById('db-holdings').innerHTML = connectCard;
    document.getElementById('db-alloc').innerHTML = '';
    document.getElementById('db-crosschain').innerHTML = '';
    document.getElementById('db-activity').innerHTML = '';
    document.getElementById('db-hold-n').textContent = '0 assets';
    const btn = document.getElementById('db-connect');
    if (btn) btn.onclick = () => ARC.wallet.connect().catch(() => {});
  }

  // ── ORCHESTRATION ─────────────────────────────────────────────
  async function refresh(){
    if (!state.addr){ renderDisconnected(); return; }
    // Prices first (holdings valuation depends on them), then everything in parallel.
    state.prices = await fetchPrices();
    await Promise.all([
      loadHoldings().then(() => { renderHoldings(); renderAllocation(); renderProfile(); }),
      renderCrossChain(),
      renderActivity(),
    ]);
  }

  function onWalletChange(){
    const s = ARC.wallet.snapshot();
    const next = s.connected ? s.address : null;
    if (next === state.addr) return;
    state.addr = next;
    refresh();
  }
  ARC.wallet.on(onWalletChange);
  onWalletChange();

  // Light refresh: re-price + re-value every 60s while connected.
  setInterval(() => { if (state.addr) refresh(); }, 60000);

})().catch(err => console.error('[dashboard] fatal:', err));
</script>
</body>
